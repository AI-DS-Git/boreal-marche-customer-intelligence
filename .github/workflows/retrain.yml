name: Weekly retrain

# Retrains Head A, compares it with the deployed model on the same held-out slice,
# and - ONLY if the promotion gate passes - opens a pull request with the new artifact
# and a metrics table. It never deploys: a human reviews and merges; the merge triggers
# CI and then Deploy exactly like any other change.
on:
  schedule:
    - cron: "17 6 * * 1"        # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Open a PR even if the promotion gate fails (manual override, recorded in metadata)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: retrain
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-api.txt

      - name: Install (same pinned versions as the serving image)
        run: pip install -r requirements-api.txt openpyxl

      - name: Download UCI Online Retail II
        run: |
          mkdir -p data/raw
          curl -fsSL -o /tmp/orii.zip "https://archive.ics.uci.edu/static/public/502/online+retail+ii.zip"
          unzip -o /tmp/orii.zip -d /tmp/orii
          cp /tmp/orii/online_retail_II.xlsx data/raw/online_retail_II.xlsx
          sha256sum data/raw/online_retail_II.xlsx

      - name: Build gold features
        run: python src/build_gold_features.py

      - name: Train candidate and apply promotion gate
        run: |
          FORCE=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then FORCE="--force"; fi
          python scripts/retrain.py --write-models $FORCE

      - name: Rebuild drift reference for the promoted model
        if: ${{ hashFiles('reports/retrain/decision.json') != '' }}
        run: |
          if python -c "import json,sys; sys.exit(0 if json.load(open('reports/retrain/decision.json'))['promote'] else 1)"; then
            python scripts/build_reference_stats.py
            echo "PROMOTE=true" >> "$GITHUB_ENV"
          else
            echo "PROMOTE=false" >> "$GITHUB_ENV"
          fi

      - name: Publish report
        run: cat reports/retrain/report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: retrain-report
          path: reports/retrain/

      - name: Open pull request (human merges; nothing is deployed)
        if: env.PROMOTE == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          # GITHUB_TOKEN-created PRs do not trigger CI. Add a fine-grained PAT as the
          # RETRAIN_PAT secret (contents+pull-requests write) so required checks run.
          token: ${{ secrets.RETRAIN_PAT || secrets.GITHUB_TOKEN }}
          branch: retrain/${{ github.run_id }}
          delete-branch: true
          add-paths: |
            models/
            reports/retrain/
          commit-message: "retrain: candidate model (weekly job)"
          title: "Retrain: candidate model passed the promotion gate"
          body-path: reports/retrain/report.md
          labels: retrain
