name: Deploy
# Continuous delivery to AWS (ECS Express Mode on Fargate). Runs only after CI succeeded on main,
# or manually. Authenticates with GitHub OIDC: no AWS keys are stored in GitHub.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # OIDC token for AWS
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ca-central-1' }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID || '793239960389' }}
  CLUSTER: default
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/boreal-github-deploy
          role-session-name: boreal-deploy-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push API image (tagged with the commit SHA)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: GIT_SHA=${{ env.SHA }}
          tags: ${{ steps.ecr.outputs.registry }}/boreal-api:${{ env.SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push UI image (tagged with the commit SHA)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ui
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/boreal-ui:${{ env.SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy API
        id: api
        uses: aws-actions/amazon-ecs-deploy-express-service@v1
        with:
          service-name: boreal-api
          cluster: ${{ env.CLUSTER }}
          image: ${{ steps.ecr.outputs.registry }}/boreal-api:${{ env.SHA }}
          execution-role-arn: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/ecsTaskExecutionRole
          infrastructure-role-arn: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/ecsInfrastructureRoleForExpressServices
          container-port: "8000"
          health-check-path: /ready
          cpu: "512"
          memory: "1024"
          min-task-count: "1"
          max-task-count: "1"   # one task: the prediction log is a local SQLite file (see docs/aws_setup.md)
          environment-variables: '[{"name":"DATABASE_URL","value":"sqlite:////tmp/api_logs.db"}]'

      - name: Wait for the API to serve this exact commit
        id: apiurl
        run: |
          ep="${{ steps.api.outputs.endpoint }}"
          case "$ep" in http*) ;; *) ep="https://$ep";; esac
          echo "url=$ep" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 60); do
            v=$(curl -fsS --max-time 10 "$ep/version" 2>/dev/null | jq -r .git_sha 2>/dev/null || true)
            echo "attempt $i: deployed sha = '${v}'"
            [ "$v" = "$SHA" ] && break
            sleep 10
          done
          test "$v" = "$SHA"

      - name: Deploy UI
        id: ui
        uses: aws-actions/amazon-ecs-deploy-express-service@v1
        with:
          service-name: boreal-ui
          cluster: ${{ env.CLUSTER }}
          image: ${{ steps.ecr.outputs.registry }}/boreal-ui:${{ env.SHA }}
          execution-role-arn: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/ecsTaskExecutionRole
          infrastructure-role-arn: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/ecsInfrastructureRoleForExpressServices
          container-port: "8501"
          health-check-path: /_stcore/health
          cpu: "256"
          memory: "512"
          min-task-count: "1"
          max-task-count: "1"
          environment-variables: '[{"name":"API_URL","value":"${{ steps.apiurl.outputs.url }}"}]'

      - name: Post-deploy smoke test
        run: |
          ui="${{ steps.ui.outputs.endpoint }}"
          case "$ui" in http*) ;; *) ui="https://$ui";; esac
          api="${{ steps.apiurl.outputs.url }}"
          for i in $(seq 1 40); do
            curl -fsS --max-time 10 "$ui/_stcore/health" | grep -qi ok && break || sleep 10
          done
          curl -fsS "$ui/_stcore/health"; echo
          curl -fsS "$api/ready"; echo
          v=$(curl -fsS "$api/version" | jq -r .git_sha)
          test "$v" = "$SHA"
          echo "### Deployed commit ${SHA::7}" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: $api/docs" >> "$GITHUB_STEP_SUMMARY"
          echo "- UI: $ui" >> "$GITHUB_STEP_SUMMARY"
